security:
    password_hashers:
        App\Entity\User:
            algorithm: argon2id

    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: aEmail

    firewalls:
        dev:
            pattern: ^/(_profiler(/|$)|(_wdt|assets|build)/)
            security: false
        main:
            lazy: true
            provider: app_user_provider
            form_login:
                login_path: app_login
                check_path: app_login
                username_parameter: email
                password_parameter: password
                enable_csrf: true
                default_target_path: app_home
            logout:
                path: app_logout
                target: app_login
                enable_csrf: true
            # 5 essais par compte et par adresse IP toutes les 15 minutes
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'
            two_factor:
                auth_form_path: 2fa_login
                check_path: 2fa_login_check
                enable_csrf: true

    # Seule la première règle qui correspond s'applique
    access_control:
        - { path: ^/health$, roles: PUBLIC_ACCESS }
        - { path: ^/connexion$, roles: PUBLIC_ACCESS }
        - { path: ^/deconnexion$, roles: PUBLIC_ACCESS }
        - { path: ^/mot-de-passe-oublie, roles: PUBLIC_ACCESS }
        - { path: ^/(mentions-legales|confidentialite|conditions-utilisation)$, roles: PUBLIC_ACCESS }
        - { path: ^/2fa, roles: IS_AUTHENTICATED_2FA_IN_PROGRESS }
        - { path: ^/ecole, roles: ROLE_SCHOOL }
        - { path: ^/tuteur, roles: ROLE_TUTOR }
        - { path: ^/apprenti, roles: ROLE_APPRENTICE }
        - { path: ^/, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            # Coût minimal en test : le hachage Argon2id volontairement lent ralentirait la suite
            App\Entity\User:
                algorithm: argon2id
                time_cost: 3
                memory_cost: 10
